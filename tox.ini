[tox]
minversion = 4.67.1
envlist = py3{11,12,13,14,15},cover,docs,lint,format

[testenv]
setenv = VIRTUAL_ENV={envdir}
package = editable
install_command = pip install {opts} {packages}

dependency_groups = test
commands =
  pytest --disable-warnings -v {posargs}

[testenv:cover]
dependency_groups = test
commands =
  pytest --cov-config=.coveragerc --cov pyds8k --disable-warnings -v {posargs}

[testenv:docs]
dependency_groups = dev
commands =
  sphinx-build -b html docs docs/html

[testenv:lint]
package = skip
dependency_groups = dev
commands =
  ruff check {posargs} ./pyds8k

[testenv:format]
package = skip
dependency_groups = dev
commands =
  ruff format --check --diff {posargs} ./pyds8k